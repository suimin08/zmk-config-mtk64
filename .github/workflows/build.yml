on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    if: github.ref_name != 'mb1-release-fix'
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main


  mb1-release-fix-build:
    if: github.ref_name == 'mb1-release-fix' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Pin tested ZMK revision only in runner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("config/west.yml")
          s = p.read_text()
          old = "    - name: zmk\n      remote: zmkfirmware\n      revision: main\n"
          new = "    - name: zmk\n      remote: zmkfirmware\n      revision: 4de313367288aad5aeaa1243890e40dc813f7008\n"
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Fetch dependencies
        run: |
          west init -l config
          west update --fetch-opt=--filter=tree:0
          west zephyr-export
      - name: Patch MB1 button release in build workspace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("zmk/app/src/hid.c")
          s = p.read_text()
          anchor = "int zmk_hid_mouse_button_release(zmk_mouse_button_t button) {"
          start = s.index(anchor)
          guard = """    if (button >= ZMK_HID_MOUSE_NUM_BUTTONS) {
                  return -EINVAL;
              }

          """
          # Guard indentation is normalized here to match upstream ZMK.
          guard = "    if (button >= ZMK_HID_MOUSE_NUM_BUTTONS) {\n        return -EINVAL;\n    }\n\n"
          needle = anchor + "\n" + guard
          assert s.count(needle) == 1, "Unexpected ZMK hid.c; patch aborted"
          insert = """    /* MB1-only workaround: discard stuck reference count on release. */
              if (button == 0) {
                  LOG_WRN("MB1 release recovery: count %d -> 0", explicit_button_counts[button]);
                  explicit_button_counts[button] = 0;
                  WRITE_BIT(explicit_buttons, button, false);
                  SET_MOUSE_BUTTONS(explicit_buttons);
                  return 0;
              }

          """
          insert = insert.replace("              ", "    ").replace("                  ", "        ")
          replacement = needle + insert
          p.write_text(s.replace(needle, replacement, 1))
          PY
      - name: Build OLED dongle only
        run: |
          west build -s zmk/app -d build -b 'xiao_ble//zmk' -S studio-rpc-usb-uart -- -DZMK_CONFIG="$GITHUB_WORKSPACE/config" '-DSHIELD=mtk64_DONGLE rgbled_adapter dongle_display' -DCONFIG_ZMK_STUDIO=y
      - name: Prepare firmware
        run: |
          mkdir -p firmware
          cp build/zephyr/zmk.uf2 firmware/mtk64_DONGLE_display_MB1_release_fix.uf2
      - name: Upload patched OLED firmware without publishing
        uses: actions/upload-artifact@v4
        with:
          name: mb1-release-fix-dongle
          path: firmware/mtk64_DONGLE_display_MB1_release_fix.uf2

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_name == 'right_left_dongle_rev4' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware

      - name: Create release zips
        run: |
          cd firmware

          # ====================================================================
          # パッケージング処理: ドングル接続 (1000Hz ESB) 専用の 4 構成 ZIP を作成
          # ====================================================================

          # --------------------------------------------------------------------
          # パッケージ 1: ドングル接続 (OLED付きドングル + 左右手 + フット)
          # 【役割・構成】
          # - ドングル (mtk64_DONGLE_display.uf2): ESB Central
          # - 右手 (mtk64_R_dongle.uf2): ESB Peripheral ID:2 (1000Hz ESB送信)
          # - 左手 (mtk64_L_dongle.uf2): ESB Peripheral ID:1 (1000Hz ESB送信)
          # - フット (mtk64_FOOT_dongle.uf2): ESB Peripheral ID:3 (1000Hz ESB送信)
          # --------------------------------------------------------------------
          if [ -f "mtk64_DONGLE_display.uf2" ] && [ -f "mtk64_R_dongle.uf2" ] && [ -f "mtk64_L_dongle.uf2" ] && [ -f "mtk64_FOOT_dongle.uf2" ]; then
            mkdir -p pkg_dongle_foot
            cp mtk64_DONGLE_display.uf2 pkg_dongle_foot/
            cp mtk64_R_dongle.uf2 pkg_dongle_foot/
            cp mtk64_L_dongle.uf2 pkg_dongle_foot/
            cp mtk64_FOOT_dongle.uf2 pkg_dongle_foot/mtk64_FOOT.uf2
            cp settings_reset.uf2 pkg_dongle_foot/ 2>/dev/null || true
            (cd pkg_dongle_foot && zip -q "../../mtk64ebt_Right_Left_Dongle_disp_foot.zip" *.uf2)
            rm -rf pkg_dongle_foot
          fi

          # --------------------------------------------------------------------
          # パッケージ 2: ドングル接続 (OLEDなしドングル Central + 左右手 + フット 1000Hz ESB Peripheral)
          # 【役割・構成】
          # - ドングル (mtk64_DONGLE.uf2): ESB Central (PCとUSB接続、ZMK Studio対応)
          # - 右手 (mtk64_R_dongle.uf2): ESB Peripheral ID:2 (トラックボール＋キー、1000Hz ESB送信)
          # - 左手 (mtk64_L_dongle.uf2): ESB Peripheral ID:1 (エンコーダー＋キー、1000Hz ESB送信)
          # - フット (mtk64_FOOT.uf2): ESB Peripheral ID:3 (フットスイッチ、1000Hz ESB送信)
          # --------------------------------------------------------------------
          if [ -f "mtk64_DONGLE.uf2" ] && [ -f "mtk64_R_dongle.uf2" ] && [ -f "mtk64_L_dongle.uf2" ] && [ -f "mtk64_FOOT_dongle.uf2" ]; then
            mkdir -p pkg_dongle_nodisp_foot
            cp mtk64_DONGLE.uf2 pkg_dongle_nodisp_foot/
            cp mtk64_R_dongle.uf2 pkg_dongle_nodisp_foot/
            cp mtk64_L_dongle.uf2 pkg_dongle_nodisp_foot/
            cp mtk64_FOOT_dongle.uf2 pkg_dongle_nodisp_foot/mtk64_FOOT.uf2
            cp settings_reset.uf2 pkg_dongle_nodisp_foot/ 2>/dev/null || true
            (cd pkg_dongle_nodisp_foot && zip -q "../../mtk64ebt_Right_Left_Dongle_foot.zip" *.uf2)
            rm -rf pkg_dongle_nodisp_foot
          fi

          # --------------------------------------------------------------------
          # パッケージ 3: ドングル接続 (OLED付きドングル Central + 左右手 1000Hz ESB Peripheral)
          # 【役割・構成】
          # - ドングル (mtk64_DONGLE_display.uf2): ESB Central (OLED表示: レイヤー/BongoCat/WPM/モディファイア)
          # - 右手 (mtk64_R_dongle.uf2): ESB Peripheral ID:2 (トラックボール＋キー、1000Hz ESB送信)
          # - 左手 (mtk64_L_dongle.uf2): ESB Peripheral ID:1 (エンコーダー＋キー、1000Hz ESB送信)
          # --------------------------------------------------------------------
          if [ -f "mtk64_DONGLE_display.uf2" ] && [ -f "mtk64_R_dongle.uf2" ] && [ -f "mtk64_L_dongle.uf2" ]; then
            zip -q "../mtk64ebt_Right_Left_Dongle_display.zip" mtk64_DONGLE_display.uf2 mtk64_R_dongle.uf2 mtk64_L_dongle.uf2 settings_reset.uf2 2>/dev/null || true
          fi

          # --------------------------------------------------------------------
          # パッケージ 4: ドングル接続 (ドングル Central + 左右手 1000Hz ESB Peripheral)
          # 【役割・構成】
          # - ドングル (mtk64_DONGLE.uf2): ESB Central (PCとUSB接続、ZMK Studio対応)
          # - 右手 (mtk64_R_dongle.uf2): ESB Peripheral ID:2 (トラックボール＋キー、1000Hz ESB送信)
          # - 左手 (mtk64_L_dongle.uf2): ESB Peripheral ID:1 (エンコーダー＋キー、1000Hz ESB送信)
          # --------------------------------------------------------------------
          if [ -f "mtk64_DONGLE.uf2" ] && [ -f "mtk64_R_dongle.uf2" ] && [ -f "mtk64_L_dongle.uf2" ]; then
            zip -q "../mtk64ebt_Right_Left_Dongle.zip" mtk64_DONGLE.uf2 mtk64_R_dongle.uf2 mtk64_L_dongle.uf2 settings_reset.uf2 2>/dev/null || true
          fi

          # --------------------------------------------------------------------
          # パッケージ 5: 変則構成 (左手ボール / 右手エンコーダー + OLED付きドングル)
          # 【役割・構成】
          # - ドングル (mtk64_DONGLE_display.uf2): ESB Central
          # - 左手 (mtk64_L_leftball.uf2): ESB Peripheral ID:1 (トラックボール＋キー、1000Hz ESB送信)
          # - 右手 (mtk64_R_leftball.uf2): ESB Peripheral ID:2 (エンコーダー＋キー、1000Hz ESB送信)
          # --------------------------------------------------------------------
          if [ -f "mtk64_DONGLE_display.uf2" ] && [ -f "mtk64_L_leftball.uf2" ] && [ -f "mtk64_R_leftball.uf2" ]; then
            zip -q "../mtk64ebt_Right_Left_Dongle_disp_leftball.zip" mtk64_DONGLE_display.uf2 mtk64_L_leftball.uf2 mtk64_R_leftball.uf2 settings_reset.uf2 2>/dev/null || true
          fi

          cd ..
          
          echo "TAG_NAME=latest-dongle-rev4" >> $GITHUB_ENV

      - name: Update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.TAG_NAME }}
          allowUpdates: true
          removeArtifacts: false
          artifacts: "*.zip"
          body: "Automated pre-built firmware packages for mtk64ebt (4 Dongle ESB configurations on right_left_dongle_rev4)"
          name: "Latest Dongle Firmware (mtk64ebt right_left_dongle_rev4)"
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to mtk64ebt repository
        env:
          PAT_TOKEN: ${{ secrets.MTK64EBT_PUSH_TOKEN }}
        run: |
          if [ -z "${PAT_TOKEN}" ]; then
            echo "::warning::MTK64EBT_PUSH_TOKEN is not configured. Skipping push to mtk64ebt repository."
            exit 0
          fi
          
          git clone https://x-access-token:${PAT_TOKEN}@github.com/mentako-ya/mtk64ebt.git mtk64ebt-repo
          mkdir -p mtk64ebt-repo/firmware/rev4
          cp *.zip mtk64ebt-repo/firmware/rev4/
          
          cd mtk64ebt-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/rev4/
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-update Rev4 Dongle firmware ZIPs from zmk-config-mtk64@${{ github.sha }}"
            git push origin main
          else
            echo "No changes in firmware ZIP. Skipping push."
          fi


